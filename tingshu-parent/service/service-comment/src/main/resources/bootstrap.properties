spring.application.name=service-comment
spring.profiles.active=dev
spring.main.allow-bean-definition-overriding=true
spring.cloud.nacos.discovery.server-addr=192.168.254.156:8848
spring.cloud.nacos.config.server-addr=192.168.254.156:8848
spring.cloud.nacos.config.prefix=${spring.application.name}
spring.cloud.nacos.config.file-extension=yaml
spring.cloud.nacos.config.shared-configs[0].data-id=common.yaml
# Nacos 上的 service-comment-dev.yaml 里 server.port 是注释掉的（默认会起在 8080），
# 这里显式指定 8508，避免和其它服务/本地端口冲突；要统一收到 Nacos 就把这行删掉并取消那边的注释
server.port=8508
